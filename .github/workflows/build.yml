name: Build and push

# Builds this repo's own Dockerfile and pushes to GHCR - moved here from
# the separate Vlad-Akulov/trmnl-byos-build repo, which existed only
# because that setup needed to check out someone else's (usetrmnl/
# byos_django, dead upstream since April 2025) code from a repo we didn't
# control. Now that this fork *is* the source, there's no reason to build
# it from anywhere else.
#
# Pushes a real version tag (v1.0.<run number>) alongside :latest. Purely
# digest-pinned :latest tracking (k8s-infrastructure's original approach)
# works but every Renovate PR just shows an opaque hash change - a real
# tag gives Renovate (and anyone reading the PR) an actual "v1.0.12 ->
# v1.0.13" to look at. github.run_number is monotonic and needs no manual
# bookkeeping, unlike a real semver bump which would require deciding
# major/minor/patch by hand on every push.
#
# Runs on a plain GitHub-hosted runner, not a dedicated self-hosted scale
# set like the old repo needed - this repo is public, so GitHub-hosted
# minutes are free, and a hosted runner has none of the dind/MTU
# workarounds the old private-repo self-hosted setup needed (not on the
# cluster's overlay network at all).

on:
  workflow_dispatch: {}
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/vlad-akulov/trmnl-byos
      VERSION: v1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build
        run: docker build -t "${IMAGE}:${VERSION}" -t "${IMAGE}:latest" .

      - name: Smoke test - image actually starts and Django boots clean
        run: docker run --rm "${IMAGE}:${VERSION}" python manage.py check

      - name: Push
        run: |
          docker push "${IMAGE}:${VERSION}"
          docker push "${IMAGE}:latest"
