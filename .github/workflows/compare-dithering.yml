name: Compare wand vs Pillow dithering output
on:
  push:
    branches: [experiment/pillow-instead-of-wand]
  workflow_dispatch: {}

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install both old (wand/ImageMagick) and new (Pillow) toolchains
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends imagemagick libmagickwand-dev
          pip install wand Pillow

      - name: Generate a representative 800x480 test screenshot (TRMNL's real resolution)
        run: |
          python3 -c "
          from PIL import Image, ImageDraw, ImageFont
          img = Image.new('RGB', (800, 480), 'white')
          d = ImageDraw.Draw(img)
          # Text at a few sizes - dithering behavior on text edges is the
          # most visually sensitive case for an e-ink display.
          try:
              font_big = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf', 48)
              font_small = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf', 20)
          except Exception:
              font_big = font_small = ImageFont.load_default()
          d.text((40, 30), 'TRMNL Dashboard', fill='black', font=font_big)
          d.text((40, 100), 'Weather: 72F, partly cloudy - Meeting at 3pm with the team', fill='black', font=font_small)
          # Grayscale gradient band - the classic dithering stress case
          for x in range(700):
              gray = int(255 * x / 700)
              d.line([(50 + x, 160), (50 + x, 220)], fill=(gray, gray, gray))
          # A few shapes at different gray levels
          d.rectangle([50, 250, 250, 350], fill=(200, 200, 200), outline='black', width=2)
          d.ellipse([300, 250, 500, 350], fill=(120, 120, 120), outline='black', width=2)
          d.rectangle([550, 250, 750, 350], fill=(60, 60, 60), outline='black', width=2)
          d.text((40, 400), 'Small footer text 8pt-ish for edge-case dithering', fill=(80, 80, 80), font=font_small)
          img.save('screen.png')
          print('test image generated')
          "

      - name: Old pipeline (wand/ImageMagick) - exact code from main
        run: |
          python3 -c "
          from wand.image import Image
          with Image(filename='screen.png') as img:
              img.posterize(2, dither='floyd_steinberg')
              amap = Image(width=img.width, height=img.height, pseudo='pattern:gray50')
              amap.composite(img, 0, 0)
              img = amap
              img.quantize(2, colorspace_type='gray')
              img.depth = 1
              img.strip()
              img.save(filename='bmp3:old-wand.bmp')
          "

      - name: New pipeline (Pillow) - exact code from this branch
        run: |
          python3 -c "
          from PIL import Image
          with Image.open('screen.png') as img:
              img = img.convert('L').convert('1')
              img.save('new-pillow.bmp', format='BMP')
          "

      - name: Convert both to PNG for easy viewing (BMP renders inconsistently in browsers/tools)
        run: |
          python3 -c "
          from PIL import Image
          Image.open('old-wand.bmp').convert('RGB').save('old-wand.png')
          Image.open('new-pillow.bmp').convert('RGB').save('new-pillow.png')
          Image.open('screen.png').save('original.png')
          "

      - uses: actions/upload-artifact@v4
        with:
          name: dither-comparison
          path: |
            original.png
            old-wand.png
            new-pillow.png
